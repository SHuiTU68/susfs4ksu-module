name: Build and Release

on:
  push:
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v1.5.2+ branch
        uses: actions/checkout@v4
        with:
          ref: v1.5.2+

      - name: Update version with git HEAD
        run: |
          RANDOM_STRING=$(git rev-parse --short HEAD | cut -c1-7)
          echo "BUILD_ID=${RANDOM_STRING}" >> $GITHUB_ENV
          # Append CI build suffix to the existing version (e.g. v2.2.0-KPM-R30
          # becomes v2.2.0-KPM-R30-CI-abc1234) instead of overwriting it.
          # Previously this forced version back to v1.5.2-CI-xxx which broke
          # all WebUI version gates (status page, toggles, AVC, etc.).
          CURRENT_VERSION=$(grep '^version=' module.prop | cut -d'=' -f2-)
          if ! echo "$CURRENT_VERSION" | grep -q "CI-${RANDOM_STRING}"; then
            sed -i "s|^version=.*|version=${CURRENT_VERSION}-CI-${RANDOM_STRING}|" module.prop
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-1.5.2+_${{ env.BUILD_ID }}
          path: |
            ${{ github.workspace }}/**/*
            !${{ github.workspace }}/.git/**
            !${{ github.workspace }}/.github/**
            !${{ github.workspace }}/node_modules/**
            !${{ github.workspace }}/src/**
            !${{ github.workspace }}/tests/**
            !${{ github.workspace }}/README.md
            !${{ github.workspace }}/LICENSE

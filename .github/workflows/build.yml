name: Build and Release

on:
  push:
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Checkout KernelPatch (for KPM headers)
        uses: actions/checkout@v4
        with:
          repository: bmax121/KernelPatch
          # Full 40-char SHA required: short SHAs trigger a branch/tag glob
          # in actions/checkout's fetch refspec and fail with exit code 1.
          #
          # 2026-09-24 ("bypass Shadow Call Stack").  Pinned to the KernelPatch
          # generation that the APatch app currently embeds, because the KPM's
          # undefined symbols are resolved at LOAD time against the *runtime*
          # KernelPatch: using a header that declares a symbol the device's
          # KernelPatch does not export makes the whole KPM fail to load.
          #
          # It must be >= 2dc68c2 (2026-09-11, "syscall: one gated dispatcher
          # hook instead of per-syscall hooks") — that commit introduced
          # hook_syscalln_override() and the `allow_skip` gate in
          # syscall_dispatch_before(), both of which susfs_kpm.c depends on:
          # only a slot registered with allow_skip=1 may suppress the real
          # syscall, and hook_syscalln() registers with allow_skip=0.
          # (Before that commit, the pin was 55c439fa4d9c945ceeb57a3610b8a9a988647cb5
          # from 2026-07-04, which predates the dispatcher rework entirely.)
          ref: b51197aaba8f2272dd8a3e30c85698a29aa928c9
          path: KernelPatch

      - name: Install clang & lld for KPM cross-compile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm
          clang --version
          ld.lld --version

      - name: Build susfs_kpm.kpm
        run: |
          cd kpm
          make clean || true
          # clang + lld: the Arm GNU bare-metal toolchain rejects
          # -mno-outline-atomics, so we cross-compile with clang instead.
          make CC_OVERRIDE="clang --target=aarch64-linux-gnu" \
               KP_DIR=../KernelPatch -j$(nproc)
          echo "=== KPM built ==="
          file build/susfs_kpm.kpm
          cp build/susfs_kpm.kpm ../susfs_kpm.kpm

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build ksu_susfs userspace binary
        run: |
          cd ksu_susfs
          ${NDK_ROOT}/ndk-build -j$(nproc) NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
          echo "=== ksu_susfs binary built ==="
          file libs/arm64-v8a/ksu_susfs
          cp libs/arm64-v8a/ksu_susfs ../ksu_susfs_arm64
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Update version with git HEAD
        run: |
          RANDOM_STRING=$(git rev-parse --short HEAD | cut -c1-7)
          echo "BUILD_ID=${RANDOM_STRING}" >> $GITHUB_ENV
          # Append CI build suffix to the existing version (e.g. v2.2.0-KPM-R30
          # becomes v2.2.0-KPM-R30-CI-abc1234) instead of overwriting it.
          # Previously this forced version back to v1.5.2-KPM-CI-xxx which
          # broke ALL WebUI version gates:
          #   v(E,1,5,3)=false -> status page hidden
          #   v(E,1,5,5)=false -> auto_try_umount toggle hidden
          #   v(E,1,5,7)=false -> hide_sus_mnts toggle hidden
          #   v(E,1,5,8)=false -> umount_for_zygote toggle hidden
          #   v(E,1,5,9)=false -> avc_log_spoofing toggle disabled
          # causing every feature to show "Disabled" on the status page.
          CURRENT_VERSION=$(grep '^version=' module.prop | cut -d'=' -f2-)
          if ! echo "$CURRENT_VERSION" | grep -q "CI-${RANDOM_STRING}"; then
            sed -i "s|^version=.*|version=${CURRENT_VERSION}-CI-${RANDOM_STRING}|" module.prop
          fi

      - name: Assemble module zip
        run: |
          mkdir -p assemble/tools
          # ship the freshly built binary and KPM
          cp ksu_susfs_arm64 assemble/tools/ksu_susfs_arm64
          cp susfs_kpm.kpm assemble/susfs_kpm.kpm
          # copy all module files
          for f in module.prop customize.sh service.sh post-fs-data.sh post-mount.sh \
                   boot-completed.sh action.sh uninstall.sh sepolicy.rule utils.sh \
                   config.sh susfs_reset.sh susfs-bin-check.sh susfs-bin-update.sh \
                   banner.png susfsicon.png update.json legit_mounts.txt \
                   sus_mount.txt try_umount.txt sus_path.txt sus_path_loop.txt \
                   sus_maps.txt sus_open_redirect.txt sus_kstat_statically.json; do
            [ -f "$f" ] && cp "$f" assemble/
          done
          # webroot
          [ -d webroot ] && cp -r webroot assemble/
          cd assemble
          zip -r9 ../susfs4ap-kpm-${{ env.BUILD_ID }}.zip .
          cd ..
          ls -lh susfs4ap-kpm-*.zip

      - name: Assemble metamodule zip
        run: |
          # The metamodule is a *separate* flashable package (id kpmmount):
          # APatch and Magisk zip installers cannot nest, and the metamodule has
          # to be installed as its own module so apd creates
          # /data/adb/metamodule -> /data/adb/modules/kpmmount.
          mkdir -p assemble-meta/tools
          cp metamodule/module.prop metamodule/customize.sh metamodule/metamount.sh \
             metamodule/metainstall.sh metamodule/metauninstall.sh \
             metamodule/boot-completed.sh metamodule/action.sh metamodule/uninstall.sh \
             assemble-meta/
          chmod 755 assemble-meta/*.sh
          # Ship the freshly built engine inside the metamodule zip too, so the
          # metamodule works on an APatch install that never had susfs4ksu (its
          # customize.sh keeps an existing engine instead of downgrading one).
          cp susfs_kpm.kpm assemble-meta/susfs_kpm.kpm
          # mctl is the userspace client for the engine's kcmp channel; build
          # it here once it exists, so that its absence is explicit in the log.
          if [ -f tools/mctl ]; then
            cp tools/mctl assemble-meta/tools/mctl
            chmod 755 assemble-meta/tools/mctl
          else
            echo "::warning::tools/mctl is missing - the metamodule will run script-only (E4 fallback)"
          fi
          cd assemble-meta
          zip -r9 ../kpmmount-${{ env.BUILD_ID }}.zip .
          cd ..
          ls -lh kpmmount-*.zip

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs_kpm-${{ env.BUILD_ID }}
          path: susfs_kpm.kpm

      - name: Upload module zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs4ap-kpm-${{ env.BUILD_ID }}
          path: susfs4ap-kpm-*.zip

      - name: Upload metamodule zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpmmount-metamodule-${{ env.BUILD_ID }}
          path: kpmmount-*.zip

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-1.5.2+_${{ env.BUILD_ID }}
          path: |
            ${{ github.workspace }}/**/*
            !${{ github.workspace }}/.git/**
            !${{ github.workspace }}/.github/**
            !${{ github.workspace }}/node_modules/**
            !${{ github.workspace }}/src/**
            !${{ github.workspace }}/tests/**
            !${{ github.workspace }}/README.md
            !${{ github.workspace }}/LICENSE

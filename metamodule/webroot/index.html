<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>KPM Mount</title>
<link rel="icon" href="icon.png" />
<!-- Self-contained on purpose: no CDN, no build step.  apd serves this
     directory verbatim, and the WebView has no network guarantee, so every
     asset has to sit next to this file. -->

<style>
:root{
  --bg:#0b0f14; --card:#141a22; --line:#243040; --fg:#e6edf5; --dim:#8b9bb0;
  --accent:#22c55e; --accent2:#15803d; --warn:#f59e0b; --err:#ef4444; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));
  -webkit-text-size-adjust:100%;
}
h1{font-size:20px;margin:0}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
header{margin-bottom:14px}
.sub{color:var(--dim);font-size:13px;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;background:#0d1219;border:1px solid var(--line);border-radius:10px;padding:10px;margin:0;max-height:42vh;overflow:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:#1b2330;color:var(--fg);border-radius:10px;padding:11px 12px;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent2);color:#04170c}
.btn.wide{grid-column:1 / -1}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.ok{color:var(--accent);border-color:rgba(34,197,94,.5)}
.chip.warn{color:var(--warn);border-color:rgba(245,158,11,.5)}
.chip.bad{color:var(--err);border-color:rgba(239,68,68,.5)}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--dim);font-size:13px}
.note{font-size:12px;color:var(--dim);margin-top:10px}
.acts{display:flex;gap:10px;margin-top:14px}
.acts>*{flex:1}
.dialog{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.dialog.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;max-width:360px;width:100%}
.box h3{margin:0 0 8px;font-size:16px}
.box p{margin:0 0 14px;color:var(--dim);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>KPM Mount</h1>
  <p class="sub">Module mount bridge &middot; engine: <span id="engine" class="chip">checking&hellip;</span></p>
</header>

<main>
  <section class="card">
    <h2>Status</h2>
    <pre id="status">Loading&hellip;</pre>
    <div class="acts">
      <button class="btn" id="b-refresh">Refresh</button>
    </div>
  </section>

  <section class="card">
    <h2>Actions</h2>
    <div class="grid">
      <button class="btn primary wide" data-cmd="apply">Apply now (hot, E7)</button>
      <button class="btn" data-cmd="rearm">Rearm guard</button>
      <button class="btn" data-cmd="log">Show log</button>
      <button class="btn" data-cmd="enable">Enable</button>
      <button class="btn" data-cmd="disable">Disable</button>
      <button class="btn" data-cmd="e7">Prefer E7 (dcache)</button>
      <button class="btn" data-cmd="e4">Force E4 (overlayfs)</button>
    </div>
    <label class="row"><input type="checkbox" id="confirm" checked /> Ask before engine preference changes</label>
    <p class="note">Every button runs <code>/data/adb/modules/kpmmount/action.sh</code> &mdash; the same script the Action button in APatch Manager executes. Nothing here reimplements the mount logic.</p>
  </section>

  <section class="card">
    <h2>Output</h2>
    <pre id="out">(idle)</pre>
  </section>
</main>

<div class="dialog" id="dlg">
  <div class="box">
    <h3 id="dlg-title">Confirm</h3>
    <p id="dlg-msg"></p>
    <div class="acts">
      <button class="btn" id="dlg-cancel">Cancel</button>
      <button class="btn primary" id="dlg-ok">Confirm</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ACTION = "/data/adb/modules/kpmmount/action.sh";
  var seq = 0;
  var busy = false;

  var outEl = document.getElementById("out");
  var statusEl = document.getElementById("status");
  var engineEl = document.getElementById("engine");

  var dlg = document.getElementById("dlg");
  var dlgTitle = document.getElementById("dlg-title");
  var dlgMsg = document.getElementById("dlg-msg");
  var pending = null;

  function hasKsu() {
    return typeof ksu !== "undefined" && ksu && typeof ksu.exec === "function";
  }

  function toast(msg) {
    try { if (typeof ksu !== "undefined" && ksu.toast) ksu.toast(msg); } catch (e) {}
  }

  /* ksu.exec(cmd, optionsJson, callbackName) -> window[callbackName](errno, stdout, stderr) */
  function exec(cmd) {
    return new Promise(function (resolve, reject) {
      if (!hasKsu()) { reject(new Error("KernelPatch WebUI bridge (ksu) is unavailable")); return; }
      var name = "kpmmount_cb_" + Date.now() + "_" + (seq++);
      window[name] = function (errno, stdout, stderr) {
        delete window[name];
        resolve({ errno: errno, stdout: stdout || "", stderr: stderr || "" });
      };
      try { ksu.exec(cmd, JSON.stringify({}), name); }
      catch (e) { delete window[name]; reject(e); }
    });
  }

  function setBusy(v) {
    busy = v;
    var bs = document.querySelectorAll("button");
    for (var i = 0; i < bs.length; i++) bs[i].disabled = v;
  }

  function renderOut(r) {
    var t = r.stdout;
    if (r.stderr) t += (t && t.slice(-1) !== "\n" ? "\n" : "") + r.stderr;
    if (!t) t = "(no output)";
    if (t.slice(-1) !== "\n") t += "\n";
    return t + "[exit " + r.errno + "]";
  }

  function run(sub, opts) {
    if (busy) return;
    opts = opts || {};
    var go = function () {
      setBusy(true);
      outEl.textContent = "$ " + ACTION + " " + sub + "\n";
      exec(ACTION + " " + sub).then(function (r) {
        outEl.textContent += renderOut(r);
        outEl.scrollTop = outEl.scrollHeight;
        setBusy(false);
        toast(sub + (r.errno === 0 ? " done" : " failed (exit " + r.errno + ")"));
        if (opts.after) opts.after();
      }).catch(function (e) {
        outEl.textContent += String((e && e.message) || e) + "\n";
        setBusy(false);
        toast(sub + " failed");
      });
    };
    if (opts.confirm) {
      ask(opts.confirm.title, opts.confirm.msg).then(function (ok) { if (ok) go(); });
    } else {
      go();
    }
  }

  function ask(title, msg) {
    dlgTitle.textContent = title;
    dlgMsg.textContent = msg;
    dlg.classList.add("show");
    return new Promise(function (resolve) { pending = resolve; });
  }

  function closeDlg(value) {
    dlg.classList.remove("show");
    if (pending) { pending(value); pending = null; }
  }

  document.getElementById("dlg-ok").addEventListener("click", function () { closeDlg(true); });
  document.getElementById("dlg-cancel").addEventListener("click", function () { closeDlg(false); });

  function parseEngine(text) {
    var m = /engine\s*:\s*(.+)/.exec(text);
    if (!m) return null;
    var tail = m[1];
    if (/E4/.test(tail)) return { label: "E4 overlayfs", cls: "chip warn" };
    if (/E7/.test(tail)) return { label: "E7 dcache", cls: "chip ok" };
    return { label: tail.trim(), cls: "chip" };
  }

  function refresh() {
    if (busy) return;
    setBusy(true);
    statusEl.textContent = "Loading\u2026";
    exec(ACTION + " status").then(function (r) {
      var t = r.stdout || "";
      statusEl.textContent = t || "(no output)";
      var e = parseEngine(t);
      if (e) { engineEl.textContent = e.label; engineEl.className = e.cls; }
      else { engineEl.textContent = "unknown"; engineEl.className = "chip"; }
      setBusy(false);
    }).catch(function (err) {
      statusEl.textContent = "Cannot reach the module: " + ((err && err.message) || err);
      engineEl.textContent = "unavailable";
      engineEl.className = "chip bad";
      setBusy(false);
    });
  }

  var CONFIRM = {
    e4: {
      title: "Force overlayfs (E4)",
      msg: "Module trees are mounted with real overlayfs. A refresh cannot be undone without a reboot."
    },
    disable: {
      title: "Disable mounting",
      msg: "The current mount set is dropped at the next boot. You can re-enable any time."
    }
  };

  document.getElementById("b-refresh").addEventListener("click", refresh);

  var buttons = document.querySelectorAll("button[data-cmd]");
  for (var i = 0; i < buttons.length; i++) {
    (function (b) {
      b.addEventListener("click", function () {
        var sub = b.getAttribute("data-cmd");
        var wantAsk = document.getElementById("confirm").checked && CONFIRM[sub];
        run(sub, {
          confirm: wantAsk ? CONFIRM[sub] : null,
          after: function () { if (sub !== "log") refresh(); }
        });
      });
    })(buttons[i]);
  }

  if (!hasKsu()) {
    engineEl.textContent = "no bridge";
    engineEl.className = "chip bad";
    statusEl.textContent = "This page must be opened from the APatch Manager WebUI: the ksu bridge is not present.";
  } else {
    refresh();
  }
})();
</script>
</body>
</html>
